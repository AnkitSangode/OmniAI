# OmniAI LiteLLM Proxy Configuration
# Free-first inference: local Qwen primary, Gemini hosted fallback.

model_list:
  # Primary: Local Qwen via Ollama (no per-request API charge)
  - model_name: omni-primary
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://localhost:11434

  # Fallback: Gemini (subject to Google AI free-tier quotas and limits)
  - model_name: omni-gemini-fallback
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

router_settings:
  num_retries: 1
  fallbacks:
    - omni-primary:
        - omni-gemini-fallback
